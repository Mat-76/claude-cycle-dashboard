<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פינג לקלוד</title>
<style>
  :root { --רקע:#fcfcfb; --כרטיס:#fff; --טקסט:#1a1a19; --עמום:#6b6b66; --קו:#e3e3df; --כחול:#2a78d6; --ירוק:#1f8a4c; --אדום:#c8321e; }
  @media (prefers-color-scheme: dark) { :root { --רקע:#1a1a19; --כרטיס:#242423; --טקסט:#f1f1ee; --עמום:#a3a39d; --קו:#3a3a38; --כחול:#3987e5; --ירוק:#4cc27f; --אדום:#f0705e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--רקע); color:var(--טקסט); font:18px/1.5 system-ui, "Segoe UI", Arial, sans-serif; min-height:100vh; display:grid; place-items:center; padding:16px; }
  main { width:100%; max-width:380px; background:var(--כרטיס); border:1px solid var(--קו); border-radius:16px; padding:28px 24px; text-align:center; }
  h1 { font-size:22px; margin:0 0 18px; }
  input { width:100%; padding:12px; font-size:16px; border:1px solid var(--קו); border-radius:10px; background:var(--רקע); color:var(--טקסט); direction:ltr; text-align:left; }
  button { width:100%; margin-top:12px; padding:14px; font-size:19px; font-weight:600; border:0; border-radius:10px; background:var(--כחול); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .קישור { background:none; color:var(--עמום); font-size:14px; font-weight:400; text-decoration:underline; margin-top:18px; padding:4px; }
  #מצב { margin:0 0 6px; font-size:20px; font-weight:600; }
  #פירוט { margin:0; color:var(--עמום); font-size:15px; min-height:24px; }
  .טוב { color:var(--ירוק); } .רע { color:var(--אדום); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>פינג לקלוד</h1>

  <!-- מסך 1: הזנת טוקן -->
  <section id="מסך-טוקן" hidden>
    <p style="margin:0 0 12px">הדבק כאן את טוקן ההתחברות של גיטהאב</p>
    <input id="שדה-טוקן" type="password" autocomplete="off" placeholder="github_pat_...">
    <button id="כפתור-שמירה">שמור והמשך</button>
    <p id="שגיאה-טוקן" class="רע" style="font-size:15px;margin:10px 0 0"></p>
  </section>

  <!-- מסך 2: הפעלה -->
  <section id="מסך-ראשי" hidden>
    <p id="מצב">בודק…</p>
    <p id="פירוט"></p>
    <button id="כפתור-פינג">שלח פינג עכשיו</button>
    <button id="כפתור-החלפה" class="קישור">החלף טוקן</button>
  </section>
</main>

<script>
// כתובת המאגר הפרטי שבו רץ הרובוט
const בעלים = 'Mat-76';
const מאגר = 'claude-cycle-manager';
const קובץ_תהליך = 'wakeup.yml';
const מפתח_אחסון = 'ניצול-קלוד:טוקן';

const $ = (שם) => document.getElementById(שם);

function קרא_טוקן() { try { return localStorage.getItem(מפתח_אחסון) || ''; } catch { return ''; } }
function שמור_טוקן(ערך) { try { ערך ? localStorage.setItem(מפתח_אחסון, ערך) : localStorage.removeItem(מפתח_אחסון); } catch { /* אין אחסון */ } }

async function גיטהאב(נתיב, { שיטה = 'GET', גוף, טוקן = קרא_טוקן() } = {}) {
  const תשובה = await fetch(`https://api.github.com/repos/${בעלים}/${מאגר}${נתיב}`, {
    method: שיטה,
    cache: 'no-store',
    headers: {
      Accept: 'application/vnd.github+json',
      Authorization: `Bearer ${טוקן}`,
      ...(גוף ? { 'Content-Type': 'application/json' } : {}),
    },
    body: גוף ? JSON.stringify(גוף) : undefined,
  });
  if (!תשובה.ok) { const ש = new Error('שגיאה'); ש.סטטוס = תשובה.status; throw ש; }
  return תשובה.status === 204 ? null : תשובה.json();
}

function הסבר_שגיאה(ש) {
  if (ש.סטטוס === 401) return 'הטוקן שגוי או שפג תוקפו.';
  if (ש.סטטוס === 403 || ש.סטטוס === 404) return 'לטוקן אין הרשאה למאגר. צריך הרשאות Actions ו-Contents.';
  return 'אין חיבור, נסה שוב.';
}

const שעה = (תאריך) => new Date(תאריך).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jerusalem' });

function הצג(מסך) {
  $('מסך-טוקן').hidden = מסך !== 'טוקן';
  $('מסך-ראשי').hidden = מסך !== 'ראשי';
}

let טיימר;
async function רענן() {
  clearTimeout(טיימר);
  if (!קרא_טוקן()) return;
  let ממתין = false;
  try {
    const [ריצות, מצב] = await Promise.all([
      גיטהאב(`/actions/workflows/${קובץ_תהליך}/runs?per_page=1`),
      גיטהאב('/contents/' + encodeURIComponent('מצב.json')).then((נ) => JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(נ.content.replace(/\s/g, '')), (ת) => ת.charCodeAt(0))))).catch(() => null),
    ]);
    const הרצה = ריצות.workflow_runs?.[0];
    ממתין = !!הרצה && הרצה.status !== 'completed';
    const פעיל = מצב?.סוף_חלון && Date.now() < new Date(מצב.סוף_חלון).getTime();
    $('מצב').textContent = פעיל ? `החלון פעיל עד ${שעה(מצב.סוף_חלון)}` : 'אין חלון פעיל כרגע';
    $('מצב').className = פעיל ? 'טוב' : '';
    if (ממתין) $('פירוט').textContent = 'שולח פינג עכשיו…';
    else if (!הרצה) $('פירוט').textContent = 'עוד לא היו שליחות.';
    else if (הרצה.conclusion === 'success') $('פירוט').textContent = `השליחה האחרונה הצליחה (${שעה(הרצה.created_at)})`;
    else $('פירוט').textContent = `השליחה האחרונה נכשלה (${שעה(הרצה.created_at)})`;
  } catch (ש) {
    $('מצב').textContent = 'לא הצלחתי להתחבר';
    $('מצב').className = 'רע';
    $('פירוט').textContent = הסבר_שגיאה(ש);
  }
  טיימר = setTimeout(רענן, ממתין ? 5000 : 60000);
}

async function שלח() {
  const כפתור = $('כפתור-פינג');
  כפתור.disabled = true;
  try {
    await גיטהאב(`/actions/workflows/${קובץ_תהליך}/dispatches`, { שיטה: 'POST', גוף: { ref: 'main' } });
    $('פירוט').textContent = 'נשלח! הפינג יגיע לקלוד תוך כדקה.';
    setTimeout(רענן, 6000);
  } catch (ש) {
    $('פירוט').textContent = הסבר_שגיאה(ש);
  }
  setTimeout(() => { כפתור.disabled = false; }, 5000);
}

async function שמור() {
  const טוקן = $('שדה-טוקן').value.trim();
  if (!טוקן) return;
  $('שגיאה-טוקן').textContent = '';
  $('כפתור-שמירה').disabled = true;
  try {
    await גיטהאב('', { טוקן });
    שמור_טוקן(טוקן);
    $('שדה-טוקן').value = '';
    התחל();
  } catch (ש) {
    $('שגיאה-טוקן').textContent = הסבר_שגיאה(ש);
  }
  $('כפתור-שמירה').disabled = false;
}

function התחל() {
  if (!קרא_טוקן()) { הצג('טוקן'); return; }
  הצג('ראשי');
  רענן();
}

$('כפתור-שמירה').onclick = שמור;
$('שדה-טוקן').onkeydown = (א) => { if (א.key === 'Enter') שמור(); };
$('כפתור-פינג').onclick = שלח;
$('כפתור-החלפה').onclick = () => { שמור_טוקן(''); clearTimeout(טיימר); הצג('טוקן'); };
התחל();
</script>
</body>
</html>
